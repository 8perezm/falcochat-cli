name: Publish to npm

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump
        id: version
        run: |
          # Check commit message for version bump keywords
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -qE "BREAKING CHANGE:|^feat(\([^)]*\))?:|^feature(\([^)]*\))?:|^minor(\([^)]*\))?:|^perf(\([^)]*\))?:|^refactor(\([^)]*\))?:|^revert(\([^)]*\))?:|^style(\([^)]*\))?:|^test(\([^)]*\))?:|^build(\([^)]*\))?:|^ci(\([^)]*\))?:|^chore(\([^)]*\))?:|^docs(\([^)]*\))?:|^fix(\([^)]*\))?:|^patch(\([^)]*\))?:|^merge(\([^)]*\))?:|^release(\([^)]*\))?:|^wip(\([^)]*\))?:|^major(\([^)]*\))?:"
          then
            if echo "$COMMIT_MSG" | grep -qE "BREAKING CHANGE:|^major(\([^)]*\))?:"
            then
              BUMP="major"
            elif echo "$COMMIT_MSG" | grep -qE "^feat(\([^)]*\))?:|^feature(\([^)]*\))?:|^minor(\([^)]*\))?:"
            then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          else
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Version bump type: $BUMP"

      - name: Bump version
        id: bump
        run: |
          BUMP=${{ steps.version.outputs.bump }}
          npm version $BUMP --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update version in CLI
        run: |
          # Update the version in index.js if it has a version flag
          sed -i "s/version: '[0-9]*\.[0-9]*\.[0-9]*'/version: '${{ steps.bump.outputs.new_version }}'/g" index.js || true
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"${{ steps.bump.outputs.new_version }}\"/g" index.js || true

      - name: Commit and push version bump
        run: |
          git add package.json package-lock.json index.js 2>/dev/null || git add package.json index.js
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}" || echo "No changes to commit"
          git push origin ${GITHUB_REF#refs/heads/} || echo "Push failed, may need to pull first"

      - name: Create git tag
        run: |
          git tag v${{ steps.bump.outputs.new_version }}
          git push origin v${{ steps.bump.outputs.new_version }}

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          release_name: Release v${{ steps.bump.outputs.new_version }}
          body: |
            Automated release v${{ steps.bump.outputs.new_version }}

            Changes in this release:
            - Automated version bump via GitHub Actions
          draft: false
          prerelease: false
