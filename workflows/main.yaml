name: "Code Review Workflow"
description: "Analyze code structure, then write a project summary"
version: "1.0"

defaults:
  model: "openrouter/tencent/hy3-preview"
  alternativeModel: "anthropic/claude-sonnet-4-20250514"
  retries: 2

tasks:
  - id: "plan"
    name: "Plan Analysis"
    agent: ./.agents/planner.agent.md
    command: "{{prompt}}"

  - id: "coding"
    name: "Build code"
    agent: ./.agents/software-engineer-agent-v1.agent.md
    carryContext: true
    carryContextMode: "message"

  - id: "analyze"
    name: "Analyze Code"
    agent: ./.agents/analyzer.agent.md
    carryContext: true
    carryContextMode: "message"

